[project]
name = "complexbuilder"
version = "0.0.1"
description = "module to build and predict protein multimer with ColabFold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["biopython>=1.84", "matplotlib", "numpy>=2", "pandas", "requests", "loguru"]

[tool.uv]
dev-dependencies = ["mypy", "notebook", "pytest", "pytest-cov", "ruff", "pyyaml"]

[tool.ruff]
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W", # warning
]
ignore = ["F401"]
exclude = [".ruff_cache", ".ruff.toml", ".ruff.lock"]
indent-width = 4
line-length = 88 # Same as Black.
target-version = "py311"
fixable = ["ALL"] # Allow fix for all enabled rules (when `--fix`) is provided.
unfixable = []

[tool.ruff.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double" # Like Black, use double quotes for strings.

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*Jupyter is migrating.*:DeprecationWarning",
]
addopts = "-v --color=yes --cov=complexbuilder --cov-report=term-missing"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["complexbuilder"]
